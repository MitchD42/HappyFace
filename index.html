<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyFace</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        .overlay.hidden {
            display: none;
        }
        
        .title {
            font-size: 80px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        
        .instructions {
            font-size: 24px;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        
        .phase {
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 10px;
            margin: 10px 0;
        }
        
        .phase-dodge {
            border-left: 4px solid #FF6B6B;
        }
        
        .phase-catch {
            border-left: 4px solid #4ECDC4;
        }
        
        .start-btn, .play-again-btn {
            font-size: 28px;
            padding: 20px 60px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }
        
        .start-btn:hover, .play-again-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }
        
        .game-over-title {
            font-size: 60px;
            color: #FF6B6B;
            margin-bottom: 20px;
        }
        
        .final-score {
            font-size: 36px;
            margin: 15px 0;
        }
        
        .high-score-display {
            font-size: 28px;
            color: #FFD700;
            margin: 10px 0 30px 0;
        }
        
        .new-high-score {
            font-size: 32px;
            color: #4ECDC4;
            animation: pulse 0.5s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }
        
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        
        .screen-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.1s;
        }
        
        .screen-flash.hit {
            background: rgba(255, 0, 0, 0.3);
            opacity: 1;
        }
        
        .screen-shake {
            animation: shake 0.3s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <div class="title">😊 HappyFace</div>
        <div class="instructions">
            <div class="phase phase-dodge">
                <strong>Phase 1 (0-50 points):</strong><br>
                DODGE the projectiles! The smiley shoots at your cursor.
            </div>
            <div class="phase phase-catch">
                <strong>Phase 2 (50+ points):</strong><br>
                CATCH the projectiles! Now you want to get hit.
            </div>
            <p style="margin-top: 20px; color: #888;">
                Don't let the smiley reach 100 points or it wins!
            </p>
        </div>
        <button class="start-btn" id="start-btn">Click to Start</button>
    </div>
    
    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay hidden">
        <div class="game-over-title">😈 Happy Face Wins!</div>
        <div class="final-score">Your Score: <span id="final-score">0</span></div>
        <div class="high-score-display">High Score: <span id="game-over-high-score">0</span></div>
        <div id="new-high-score-msg" class="new-high-score" style="display: none;">🎉 NEW HIGH SCORE! 🎉</div>
        <button class="play-again-btn" id="play-again-btn">Play Again</button>
    </div>
    
    <!-- Screen flash effect -->
    <div id="screen-flash" class="screen-flash"></div>
    
    <script type="module">
        import { SceneManager } from './SceneManager.js';

        let sceneManager = null;
        
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            if (sceneManager) {
                sceneManager.resetGame();
            } else {
                sceneManager = new SceneManager();
            }
            sceneManager.startGame();
        }
        
        function restartGame() {
            document.getElementById('game-over-screen').classList.add('hidden');
            sceneManager.resetGame();
            sceneManager.startGame();
        }
        
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('play-again-btn').addEventListener('click', restartGame);
        
        // Expose for SceneManager to call
        window.showGameOver = function(userScore, highScore, isNewHighScore) {
            document.getElementById('final-score').textContent = userScore;
            document.getElementById('game-over-high-score').textContent = highScore;
            document.getElementById('new-high-score-msg').style.display = isNewHighScore ? 'block' : 'none';
            document.getElementById('game-over-screen').classList.remove('hidden');
        };
        
        window.triggerHitEffect = function() {
            const flash = document.getElementById('screen-flash');
            flash.classList.add('hit');
            document.body.classList.add('screen-shake');
            
            setTimeout(() => {
                flash.classList.remove('hit');
            }, 100);
            
            setTimeout(() => {
                document.body.classList.remove('screen-shake');
            }, 300);
        };
    </script>
</body>
</html>
